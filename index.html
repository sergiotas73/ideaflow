function loadWeather(lat,lng,approx){
lastPos={lat:lat,lng:lng,ts:Date.now()};
fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&current=temperature_2m,relative_humidity_2m,weather_code,uv_index')
.then(function(r){return r.json();})
.then(function(j){
var c=j.current||{};
var w={temp:Math.round(c.temperature_2m),hum:Math.round(c.relative_humidity_2m),code:c.weather_code,uv:(c.uv_index!=null?Math.round(c.uv_index*10)/10:null),lat:lat,lng:lng,place:approx?'Madrid (aprox.)':'Mi zona',ts:Date.now()};
fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lng+'&localityLanguage=es')
.then(function(r){return r.json();})
.then(function(g){w.place=g.city||g.locality||g.principalSubdivision||w.place;finishWeather(w);})
.catch(function(){finishWeather(w);});
}).catch(function(){toast('No se pudo cargar el clima','err');});
}

function checkAlarms(){
var now=new Date();var hhmm=pad(now.getHours())+':'+pad(now.getMinutes());
var dow=(now.getDay()+6)%7;var changed=false;
DB.alarms.forEach(function(a){
if(!a.enabled)return;
if(a.type==='hora'){
if(a.repeat==='unica'){
if(a.date===todayISO()&&a.time===hhmm&&a.lastFired!==a.date+a.time){
a.lastFired=a.date+a.time;a.enabled=false;changed=true;fireAlarm(a);
}
}else if(a.days[dow]&&a.time===hhmm&&a.lastFired!==todayISO()+a.time){
a.lastFired=todayISO()+a.time;changed=true;fireAlarm(a);
}
}else if(a.type==='geo'&&lastPos&&a.lat!=null){
var d=haversine(lastPos,{lat:a.lat,lng:a.lng});
if(d<=a.radius&&!a.inside){a.inside=true;changed=true;fireAlarm(a);}
else if(d>a.radius*1.25&&a.inside){a.inside=false;changed=true;}
}
});
if(changed)save();
}

function latToY(lat,worldSize){var r=lat*Math.PI/180;return (0.5-Math.log(Math.tan(r)+1/Math.cos(r))/(2*Math.PI))*worldSize;}
function yToLat(y,worldSize){var n=Math.PI-(2*Math.PI*y)/worldSize;return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));}
function projectMap(lat,lng){
var worldSize=256*Math.pow(2,MV.z);
var cx=(MV.lng+180)/360*worldSize;
var cy=latToY(MV.lat,worldSize);
var x=(lng+180)/360*worldSize-cx+mapW/2;
var y=latToY(lat,worldSize)-cy+mapH/2;
return{x:x,y:y};
}
function unprojectScreen(sx,sy){
var worldSize=256*Math.pow(2,MV.z);
var cx=(MV.lng+180)/360*worldSize+(sx-mapW/2);
var cy=latToY(MV.lat,worldSize)+(sy-mapH/2);
return{lng:cx/worldSize*360-180,lat:yToLat(cy,worldSize)};
}
function shiftCenterPx(dx,dy){
var worldSize=256*Math.pow(2,MV.z);
var cx=(MV.lng+180)/360*worldSize-dx;
var cy=latToY(MV.lat,worldSize)-dy;
MV.lng=(cx/worldSize)*360-180;
MV.lat=yToLat(cy,worldSize);
}
function scheduleMapRender(){if(mapRafPending)return;mapRafPending=true;requestAnimationFrame(function(){mapRafPending=false;renderMapContent();});}
function renderMapContent(){
var box=document.getElementById('mapBox');if(!box)return;
mapW=box.clientWidth;mapH=box.clientHeight;
var tz=clamp(Math.floor(MV.z),1,19),scale=Math.pow(2,MV.z-tz),worldTz=256*Math.pow(2,tz);
var cx=(MV.lng+180)/360*worldTz,cy=latToY(MV.lat,worldTz);
var halfW=mapW/2/scale,halfH=mapH/2/scale;
var x0=Math.floor((cx-halfW)/256)-1,x1=Math.floor((cx+halfW)/256)+1;
var y0=Math.max(0,Math.floor((cy-halfH)/256)-1),y1=Math.min(worldTz/256-1,Math.floor((cy+halfH)/256)+1);
var nTiles=worldTz/256;
var html='';
for(var x=x0;x<=x1;x++){
for(var y=y0;y<=y1;y++){
var xx=((x%nTiles)+nTiles)%nTiles;
var left=(x*256-cx)*scale+mapW/2;
var top=(y*256-cy)*scale+mapH/2;
var sz=256*scale+0.7;
var url=MV.layer==='sat'
?'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+tz+'/'+y+'/'+xx
:'https://tile.openstreetmap.org/'+tz+'/'+xx+'/'+y+'.png';
html+='<img src="'+url+'" alt="" draggable="false" style="position:absolute;left:'+left.toFixed(1)+'px;top:'+top.toFixed(1)+'px;width:'+sz.toFixed(1)+'px;height:'+sz.toFixed(1)+'px;user-select:none;pointer-events:none">';
}
}
var tiles=document.getElementById('mapTiles');if(tiles){tiles.style.transform='';tiles.innerHTML=html;}
var pins='';
if(lastPos){
var pb=projectMap(lastPos.lat,lastPos.lng);
if(pb.x>-40&&pb.x<mapW+40&&pb.y>-40&&pb.y<mapH+40){
pins+='<div class="blueDot" style="left:'+pb.x.toFixed(1)+'px;top:'+pb.y.toFixed(1)+'px" title="Mi posición"></div>';
}
}

var p=projectMap(k2.lat,k2.lng);
if(p.x<-60||p.x>mapW+60||p.y<-60||p.y>mapH+60)return;
pins+='<button class="kpinB" style="left:'+p.x.toFixed(1)+'px;top:'+p.y.toFixed(1)+'px" onclick="openLocEdit('+ixK+')" aria-label="'+esc(k2.name)+'"><span>📍 '+esc(k2.name)+'</span><i></i></button>';
});

});

function initMap(){

if(geo.length){MV.lat=geo[0].location.lat;MV.lng=geo[0].location.lng;}

else if(DB.settings.knownLocations.length){MV.lat=DB.settings.knownLocations[0].lat;MV.lng=DB.settings.knownLocations[0].lng;}

}
if(!lastPos&&navigator.geolocation){
try{navigator.geolocation.getCurrentPosition(function(p){lastPos={lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()};startGeoWatch();scheduleMapRender();},function(){},{timeout:8000});}catch(e){}
}
mapW=box.clientWidth;mapH=box.clientHeight;
MAPD={pts:{},ids:[],mode:null,dx:0,dy:0,moved:false,pinch:null,lpTimer:null,lpX:0,lpY:0,lpDone:false};
box.onpointerdown=function(e){
try{box.setPointerCapture(e.pointerId);}catch(err){}
MAPD.pts[e.pointerId]={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};
MAPD.ids=Object.keys(MAPD.pts);
MAPD.lpDone=false;
if(MAPD.ids.length===1){
MAPD.mode='pan';MAPD.dx=0;MAPD.dy=0;MAPD.moved=false;
var rb=box.getBoundingClientRect();
MAPD.lpX=e.clientX-rb.left;MAPD.lpY=e.clientY-rb.top;
clearTimeout(MAPD.lpTimer);
MAPD.lpTimer=setTimeout(function(){
MAPD.lpDone=true;
var ll=unprojectScreen(MAPD.lpX,MAPD.lpY);
vib(40);
openSavePoint(ll.lat,ll.lng);
},600);
}
else if(MAPD.ids.length>=2){
clearTimeout(MAPD.lpTimer);
var a=MAPD.pts[MAPD.ids[0]],b=MAPD.pts[MAPD.ids[1]];
var r0=box.getBoundingClientRect();
var mx=(a.x+b.x)/2-r0.left,my=(a.y+b.y)/2-r0.top;
var mid=unprojectScreen(mx,my);
MAPD.mode='pinch';
MAPD.pinch={d0:Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),z0:MV.z,midLat:mid.lat,midLng:mid.lng,mx:mx,my:my};
}
};
box.onpointermove=function(e){
if(!MAPD.pts[e.pointerId])return;
MAPD.pts[e.pointerId].x=e.clientX;MAPD.pts[e.pointerId].y=e.clientY;
if(MAPD.mode==='pan'&&MAPD.ids.length===1){
var p=MAPD.pts[MAPD.ids[0]];
MAPD.dx=p.x-p.sx;MAPD.dy=p.y-p.sy;
if(Math.abs(MAPD.dx)+Math.abs(MAPD.dy)>10)clearTimeout(MAPD.lpTimer);
if(Math.abs(MAPD.dx)+Math.abs(MAPD.dy)>5)MAPD.moved=true;
var t=document.getElementById('mapTiles'),pn=document.getElementById('mapPins');
if(t)t.style.transform='translate('+MAPD.dx+'px,'+MAPD.dy+'px)';
if(pn)pn.style.transform='translate('+MAPD.dx+'px,'+MAPD.dy+'px)';
}else if(MAPD.mode==='pinch'&&MAPD.ids.length>=2){
var a2=MAPD.pts[MAPD.ids[0]],b2=MAPD.pts[MAPD.ids[1]];
var dd2=Math.max(20,Math.hypot(a2.x-b2.x,a2.y-b2.y));
MV.z=clamp(MAPD.pinch.z0+Math.log2(dd2/MAPD.pinch.d0),3,18.7);
var pp=projectMap(MAPD.pinch.midLat,MAPD.pinch.midLng);
shiftCenterPx(MAPD.pinch.mx-pp.x,MAPD.pinch.my-pp.y);
scheduleMapRender();
}
};
function endPointer(e){
if(!MAPD.pts[e.pointerId])return;
clearTimeout(MAPD.lpTimer);
var wasMoved=MAPD.moved;
delete MAPD.pts[e.pointerId];
MAPD.ids=Object.keys(MAPD.pts);
if(MAPD.mode==='pan'&&MAPD.ids.length===0){
if(MAPD.lpDone){MAPD.lpDone=false;MAPD.mode=null;return;}
if(wasMoved){shiftCenterPx(MAPD.dx,MAPD.dy);renderMapContent();}
else if(pickMode>=0){
var r=box.getBoundingClientRect();
var sx=e.clientX-r.left,sy=e.clientY-r.top;
var ll=unprojectScreen(sx,sy);
var l=DB.settings.knownLocations[pickMode];
if(l){l.lat=+ll.lat.toFixed(5);l.lng=+ll.lng.toFixed(5);save();toast('📍 "'+l.name+'" movido aquí');}
pickMode=-1;renderMapContent();
}
MAPD.mode=null;
}else if(MAPD.ids.length===1){
MAPD.mode='pan';
var id0=MAPD.ids[0];
MAPD.pts[id0].sx=MAPD.pts[id0].x;MAPD.pts[id0].sy=MAPD.pts[id0].y;
MAPD.dx=0;MAPD.dy=0;MAPD.moved=false;
}else if(MAPD.ids.length===0){MAPD.mode=null;}
}
box.onpointerup=endPointer;
box.onpointercancel=endPointer;

var r=box.getBoundingClientRect();

var before=unprojectScreen(sx,sy);
MV.z=clamp(MV.z+(e.deltaY<0?0.5:-0.5),3,18.7);

function capSaveVoice(){

function savePosAs(name){
name=capitalize(String(name||'').trim());
if(!name){respondLocal('📍 Claro que sí. ¿Qué nombre le pongo al punto? Por ejemplo: "guarda mi posición actual como Casa".');return;}
function done(lat,lng){
var ex=null;DB.settings.knownLocations.forEach(function(k){if(norm(k.name)===norm(name))ex=k;});
if(ex){ex.lat=+lat.toFixed(4);ex.lng=+lng.toFixed(4);}
else DB.settings.knownLocations.push({name:name,lat:+lat.toFixed(4),lng:+lng.toFixed(4)});
save();MV.lat=lat;MV.lng=lng;
respondLocal('📍 Hecho. He leído tu GPS ('+lat.toFixed(4)+', '+lng.toFixed(4)+') y he guardado el pin "'+name+'":\n• Aparece en el Mapa (toca el pin para editarlo).\n• Está en Ajustes → Memoria permanente → Ubicaciones conocidas.\n• Puedes usarlo en geoalarmas y fichas.');
}
if(lastPos&&(!lastPos.ts||Date.now()-lastPos.ts<300000)){done(lastPos.lat,lastPos.lng);}
else if(navigator.geolocation){
respondLocal('🛰️ Obteniendo tu posición GPS…');
navigator.geolocation.getCurrentPosition(function(p){
lastPos={lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()};startGeoWatch();
done(p.coords.latitude,p.coords.longitude);
},function(){respondLocal('No pude leer tu GPS. Concede el permiso de ubicación (🔐 en Ajustes → Revisar permisos) e inténtalo otra vez.');},{enableHighAccuracy:true,timeout:12000});
}else respondLocal('Este dispositivo no tiene GPS disponible.');
}
function interpretCommand(q){
var nq=norm(q);
if(/(guarda|guardar|guarde|salva|marca|registra|apunta).{0,40}(posicion|ubicacion|localizacion|punto|sitio|lugar)/.test(nq)||/(posicion|ubicacion).{0,20}como/.test(nq)){
var nm=q.match(/(?:como|con el nombre|llamad[ao]|nombre)\s+[""']?([A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9][A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 ._-]{1,30})/i);
savePosAs(nm?nm[1].trim():'');
return true;
}
if(/(recuerda|memoriza|apunta en memoria|guarda en memoria|anota que)/.test(nq)){
var added=learnFromText(q);
if(added.length){respondLocal('🧠 Guardado en memoria permanente:\n'+added.map(function(a){return '• '+a;}).join('\n')+'\nPuedes verlo y editarlo en Ajustes → Memoria permanente, o preguntarme cuando lo necesites.');return true;}
}
var ap=q.match(/^apunta\s*[:\-]\s*(.{3,})/i);
if(ap){var idea2=captureText(ap[1].trim());respondLocal('✅ He creado y guardado la ficha "'+idea2.title+'" en '+catOf(idea2).emoji+' '+catOf(idea2).name+(idea2.dueTime?' · ⏰ '+idea2.dueTime:'')+'. La tienes en el feed, el tablero y la agenda.');return true;}
var mi=q.match(/(?:crea|crear|guarda|guardar|añade|añadir|agrega|agregar)\s+(?:una?\s+|varias?\s+|estas?\s+)?(ideas?|notas?|tareas?|recordatorios?|fichas?)\s*[:\-]?\s*(.{3,})/i);
if(mi){
var idea=captureText(mi[2].trim());
respondLocal('✅ He interpretado tu ficha y la he guardado correctamente:\n• Título: '+idea.title+'\n• Categoría: '+catOf(idea).emoji+' '+catOf(idea).name+'\n• Estado: '+STATUS[idea.status].name+(idea.dueDate?'\n• Fecha: '+fmtShort(idea.dueDate)+(idea.dueTime?' · '+idea.dueTime+(idea.endTime?'–'+idea.endTime:''):''):'')+(idea.amount?'\n• Importe: '+eur(idea.amount):'')+'\nLa verás en el feed, el tablero y la agenda.');
return true;
}
return false;
}

function chatMicToggle(){
if(chatRecOn){try{if(chatRecSR)chatRecSR.stop();}catch(e){}return;}
var sr=newSR();
if(!sr){toast('Reconocimiento de voz no soportado en este navegador (usa Chrome/Android)','err');return;}
var fin='';
sr.onresult=function(e){
var inter='';
for(var i=0;i<e.results.length;i++){var t2=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t2;else inter+=t2;}
var inp=document.getElementById('chatInp');
if(inp)inp.value=(fin+inter).trim();
};
sr.onend=function(){
chatRecOn=false;chatRecSR=null;
var txt=fin.trim();
if(txt){chatSend(txt);}else{renderChat();}
};
sr.onerror=function(ev){
chatRecOn=false;chatRecSR=null;
if(ev&&ev.error==='not-allowed')toast('Permiso de micrófono denegado','err');
renderChat();
};
chatRecSR=sr;chatRecOn=true;snd('tap');vib(30);renderChat();
try{sr.start();}catch(e){chatRecOn=false;toast('No se pudo iniciar el reconocimiento','err');renderChat();}
}
function speakMsg(ix){var m=DB.chat[ix];if(m)speak(cleanForTTS(m.content));}
function chatScroll(){var el=document.getElementById('chatList');if(el)el.scrollTop=el.scrollHeight;}
function chatChip(ix){chatSend(CHIPS[ix]);}
function chatSend(txt){
var inp=document.getElementById('chatInp');
var q=(txt||(inp?inp.value:'')).trim();
if(!q||chatLoading)return;snd('tap');
DB.chat.push({role:'user',content:q});
if(inp)inp.value='';
renderChat();
if(interpretCommand(q))return;
var added=learnFromText(q);
if(added.length)toast('🧠 Memoria: '+added.join(' · '));
chatLoading=true;renderChat();
var history=DB.chat.slice(-10).map(function(m){return{role:m.role,content:m.content};});
var useWeb=webMode;
aiChatFull(history,useWeb).then(function(r){
DB.chat.push({role:'assistant',content:r.text,src:r.src});
if(DB.chat.length>60)DB.chat=DB.chat.slice(-60);
save();chatLoading=false;snd('ok');renderChat();
if(chatVoiceOn)speak(cleanForTTS(r.text));
});
}

function openBell(){
var reminders=DB.ideas.filter(function(i){return i.status!=='completado'&&i.status!=='archivo'&&i.dueDate&&i.dueDate<=todayISO();});
var h=ovHead('🔔 Recordatorios','<button class="btn btn-acc" style="padding:7px 12px;font-size:11px" onclick="enablePush()">Activar push</button>');

function enablePush(){if(typeof Notification==='undefined')return toast('No soportado','err');Notification.requestPermission().then(function(p){if(p==='granted'){DB.settings.perms.notif=true;save();}toast(p==='granted'?'✅ Notificaciones activadas':'Permiso denegado',p==='granted'?'ok':'err');});}
function permGrantedHTML(key){return '<span id="perm-'+key+'" class="tiny" style="font-weight:800;color:#22c55e;flex-shrink:0">✅ Concedido</span>';}
function permBtnHTML(key,fn){return '<button id="perm-'+key+'" class="btn btn-acc" style="padding:8px 12px;font-size:11px;flex-shrink:0" onclick="'+fn+'">Activar</button>';}
function markPerm(key){
DB.settings.perms[key]=true;save();
var el=document.getElementById('perm-'+key);
if(el)el.outerHTML=permGrantedHTML(key);
}
function probePerms(){
if(!navigator.permissions||!navigator.permissions.query)return;
var map=[['notifications','notif'],['microphone','mic'],['geolocation','geo']];
map.forEach(function(m){
try{navigator.permissions.query({name:m[0]}).then(function(st){
if(st.state==='granted'){DB.settings.perms[m[1]]=true;save();var el=document.getElementById('perm-'+m[1]);if(el&&el.tagName==='BUTTON')el.outerHTML=permGrantedHTML(m[1]);}
}).catch(function(){});}catch(e){}
});
}
function showPerms(manual){
var h=ovHead('🔐 Permisos');
h+='<div class="small muted" style="margin-bottom:12px">Cuando un permiso ya está concedido, <b>no se vuelve a pedir</b>. El estado se guarda en la app'+(manual?'.':' (primera ejecución).')+'</div>';
var P=DB.settings.perms;
h+='<div class="perm-row"><span style="font-size:22px">🔔</span><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13px">Notificaciones</div><div class="tiny muted">Recordatorios, alarmas y avisos en segundo plano</div></div>'+(P.notif?permGrantedHTML('notif'):permBtnHTML('notif','permNotif()'))+'</div>';
h+='<div class="perm-row"><span style="font-size:22px">🎤</span><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13px">Micrófono</div><div class="tiny muted">Dictado al asistente y captura de voz</div></div>'+(P.mic?permGrantedHTML('mic'):permBtnHTML('mic','permMic()'))+'</div>';
h+='<div class="perm-row"><span style="font-size:22px">📍</span><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13px">Ubicación</div><div class="tiny muted">Punto azul del mapa, clima local y geoalarmas</div></div>'+(P.geo?permGrantedHTML('geo'):permBtnHTML('geo','permGeo()'))+'</div>';
h+='<div style="display:flex;gap:9px;margin-top:14px"><button class="btn btn-ghost" style="flex:1" onclick="closePerms('+!!manual+',false)">Omitir</button><button class="btn btn-acc" style="flex:2" onclick="closePerms('+!!manual+',true)">Continuar →</button></div>';

function permNotif(){if(typeof Notification==='undefined')return toast('No soportado','err');Notification.requestPermission().then(function(p){if(p==='granted'){markPerm('notif');toast('✅ Notificaciones activadas');}else toast('Permiso denegado','err');});}
function permMic(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast('No soportado','err');navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){s.getTracks().forEach(function(t2){t2.stop();});markPerm('mic');toast('✅ Micrófono listo');}).catch(function(){toast('Permiso denegado','err');});}
function permGeo(){if(!navigator.geolocation)return toast('No soportado','err');navigator.geolocation.getCurrentPosition(function(p){lastPos={lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()};markPerm('geo');toast('✅ Ubicación concedida');fetchWeather();startGeoWatch();},function(){toast('Permiso denegado','err');});}
function closePerms(manual,goCapture){

closeOverlay();

function showOnboarding(){
var slides=[['🧠','Bienvenido a IdeaFlow AI','Tu segundo cerebro: captura por voz, texto, fotos y enlaces. La IA lo convierte en conocimiento estructurado y recuerda lo que le cuentas.'],['🏷️','Etiquetas que conectan','Escribe #hashtags dentro de tus notas y la IA las detecta, las añade y relaciona las notas entre sí. Pregunta "¿Qué sé sobre #coche?".'],['🌐','Busca fuera si no está dentro','Si algo no está en tus datos, el asistente lo busca en internet con el modelo seleccionado y te trae la información.'],['⚙️','Tuyo al 100%','Temas, fuentes, categorías propias, memoria permanente por pares y copias de seguridad. ¡Instálala para pantalla completa!']];
var s=slides[obStep];
var ov=document.getElementById('ov');ov.style.display='flex';
ov.innerHTML='<div class="ov-bg"></div><div class="ob-card"><span class="ob-emo">'+s[0]+'</span><div style="font-size:20px;font-weight:800;margin-bottom:9px">'+s[1]+'</div><div style="font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:22px">'+s[2]+'</div><div style="display:flex;justify-content:center;gap:6px;margin-bottom:22px">'+slides.map(function(_,i){return '<button style="height:6px;border-radius:99px;width:'+(i===obStep?22:7)+'px;background:'+(i===obStep?'var(--accent)':'var(--border)')+'" onclick="obStep='+i+';showOnboarding()" aria-label="Paso '+(i+1)+'"></button>';}).join('')+'</div><div style="display:flex;gap:9px"><button class="btn btn-ghost" style="flex:1" onclick="obDone(false)">Saltar</button><button class="btn btn-acc" style="flex:2" onclick="obNext()">'+(obStep<3?'Siguiente →':'🚀 Empezar')+'</button></div></div>';
}
function obNext(){if(obStep<3){obStep++;showOnboarding();}else obDone(true);}
function obDone(start){
DB.settings.onboarded=true;save();closeOverlay();
if(!DB.settings.permsDone){showPerms(false);}
else if(start){openCapture();}
}
function renderBubble(){
var b=document.getElementById('bubble');
if(!DB.settings.bubbleOn){if(b)b.remove();return;}
if(!b){
b=document.createElement('div');b.id='bubble';b.innerHTML=ic('bot',24);
document.getElementById('app').appendChild(b);
var st={sx:0,sy:0,ox:0,oy:0,moved:false};
b.addEventListener('pointerdown',function(e){var r=b.getBoundingClientRect();var pr=document.getElementById('app').getBoundingClientRect();st.sx=e.clientX;st.sy=e.clientY;st.ox=r.left-pr.left;st.oy=r.top-pr.top;st.moved=false;try{b.setPointerCapture(e.pointerId);}catch(err){}});
b.addEventListener('pointermove',function(e){if(!st.sx)return;var dx=e.clientX-st.sx,dy=e.clientY-st.sy;if(Math.abs(dx)+Math.abs(dy)>6)st.moved=true;var pr=document.getElementById('app').getBoundingClientRect();var x=clamp(st.ox+dx,4,pr.width-56);var y=clamp(st.oy+dy,4,pr.height-56);b.style.left=x+'px';b.style.top=y+'px';b.style.right='auto';b.style.bottom='auto';});
b.addEventListener('pointerup',function(){if(!st.moved){openChat();}else{DB.settings.bubblePos={left:b.style.left,top:b.style.top};save();}st.sx=0;});
}
if(DB.settings.bubblePos){b.style.left=DB.settings.bubblePos.left;b.style.top=DB.settings.bubblePos.top;b.style.right='auto';b.style.bottom='auto';}
else{b.style.right='14px';b.style.bottom='118px';b.style.left='auto';b.style.top='auto';}
}
function buildManifest(){
try{
function icon(sz){var c=document.createElement('canvas');c.width=sz;c.height=sz;var x=c.getContext('2d');var g=x.createLinearGradient(0,0,sz,sz);g.addColorStop(0,'#7c5cff');g.addColorStop(1,'#4f46e5');x.fillStyle=g;var r=sz*0.22;x.beginPath();x.moveTo(r,0);x.lineTo(sz-r,0);x.quadraticCurveTo(sz,0,sz,r);x.lineTo(sz,sz-r);x.quadraticCurveTo(sz,sz,sz-r,sz);x.lineTo(r,sz);x.quadraticCurveTo(0,sz,0,sz-r);x.lineTo(0,r);x.quadraticCurveTo(0,0,r,0);x.fill();x.fillStyle='#fff';x.font='bold '+(sz*0.55)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('⚡',sz/2,sz/2+sz*0.03);return c.toDataURL('image/png');}

window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;toast('📲 IdeaFlow se puede instalar');});
function doInstall(){
if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(function(r){if(r.outcome==='accepted')toast('🎉 Instalada: se abrirá a pantalla completa');deferredInstall=null;});}
else{
var standalone=window.matchMedia&&window.matchMedia('(display-mode: fullscreen)').matches;

document.addEventListener('visibilitychange',function(){
if(document.hidden&&typeof Notification!=='undefined'&&Notification.permission==='granted'){
var pend=DB.ideas.filter(function(i){return i.status!=='completado'&&i.status!=='archivo'&&i.dueDate&&i.dueDate<=todayISO();}).length;
var actAl=DB.alarms.filter(function(a){return a.enabled;}).length;
try{new Notification('IdeaFlow AI sigue activa',{body:(pend?pend+' recordatorio(s) pendiente(s)':'Todo al día')+' · '+actAl+' alarma(s) vigilando'});}catch(e){}
}
});
function checkReminders(){
var t=todayISO();
DB.ideas.forEach(function(i){
if(i.status!=='completado'&&i.status!=='archivo'&&i.dueDate&&i.dueDate<=t&&!notified[i.id]){
notified[i.id]=1;
toast('⏰ '+(i.dueDate<t?'Vencida':'Hoy')+': '+i.title+(i.dueTime?' · '+i.dueTime:''));
if(typeof Notification!=='undefined'&&Notification.permission==='granted'){try{new Notification('IdeaFlow AI',{body:i.emoji+' '+i.title});}catch(e){}}
vib(80);renderHeader();
}
});
}
function boot(){
applyTheme();
applyFont();
buildManifest();
renderAll();
renderBubble();
var s=document.getElementById('splash');
if(s&&s.parentNode)s.parentNode.removeChild(s);
if(HAD_DATA&&!DB.settings.onboarded){DB.settings.onboarded=true;save();}
if(!DB.settings.onboarded){showOnboarding();}
else if(!DB.settings.permsDone){showPerms(false);}
else{probePerms();}
checkReminders();checkAlarms();
setInterval(function(){checkReminders();checkAlarms();},15000);
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){lastPos={lat:p.coords.latitude,lng:p.coords.longitude,ts:Date.now()};loadWeather(p.coords.latitude,p.coords.longitude,false);startGeoWatch();},function(){if(!weather)fetchWeather();},{timeout:8000});}
else if(!weather){fetchWeather();}
save();
try{if('speechSynthesis' in window)speechSynthesis.getVoices();}catch(e){}
}
try{boot();}catch(e){fatal(e);}
</script>
